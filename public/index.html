<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10AEFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>可樂仔健康記錄</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <!-- Vant 4 CSS -->
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <keep-alive :include="['HomePage','FeedPage','DiaperPage','SleepPage']">
        <component :is="Component" />
      </keep-alive>
    </router-view>
    <!-- Bottom Tab Bar -->
    <van-tabbar v-model="activeTab" route fixed placeholder safe-area-inset-bottom>
      <van-tabbar-item icon="wap-home-o" to="/">主頁</van-tabbar-item>
      <van-tabbar-item icon="coupon-o" to="/feed" badge="">飲奶</van-tabbar-item>
      <van-tabbar-item icon="smile-o" to="/diaper">換片</van-tabbar-item>
      <van-tabbar-item icon="clock-o" to="/sleep">睡眠</van-tabbar-item>
      <van-tabbar-item icon="bars" to="/more">更多</van-tabbar-item>
    </van-tabbar>
  </div>

  <!-- Vue 3 -->
  <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <!-- Vue Router 4 -->
  <script src="https://fastly.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js"></script>
  <!-- Vant 4 -->
  <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
  <!-- App Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
